name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run leak-check
        env:
          LEAK_PATTERN: ${{ secrets.LEAK_PATTERN }}
      - run: bun run typecheck
      - run: bun run fmt:check
      - run: bun run lint
      - run: bun run test
      - run: cd apps/example && bunx expo export --platform ios --output-dir dist/ios
