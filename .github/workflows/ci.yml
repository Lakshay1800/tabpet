name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run leak-check
        env:
          LEAK_PATTERN: ${{ secrets.LEAK_PATTERN }}
          LEAK_CHECK_REQUIRED: ${{ (github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || github.actor == 'dependabot[bot]')) && '0' || '1' }}
      - run: bun run typecheck
      - run: bun run fmt:check
      - run: bun run lint
      - run: bun run test
      - run: bun run conformance --check
      - run: cd apps/example && bunx expo export --platform ios --output-dir dist/ios

  swift:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift build
      - run: swift test

  swift-uikit:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -version
      - run: bash tools/swift-sim-test.sh
