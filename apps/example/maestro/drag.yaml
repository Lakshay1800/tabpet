# Slow swipe along the floating bar. No test tool can drive the native tab bar
# scrub, so this shows a still bar and no chase: it only proves a swipe leaves
# the companion seated. The chase itself needs a finger on a device, or the
# scripted finger in drag-release.yaml.
appId: dev.example.companion
---
- launchApp
- waitForAnimationToEnd
- tapOn: 'Explore'
- waitForAnimationToEnd
- takeScreenshot: maestro/out/d1-explore-seated
- swipe:
    start: 32%, 94%
    end: 44%, 94%
    duration: 3000
- takeScreenshot: maestro/out/d2-after-release
- waitForAnimationToEnd
- takeScreenshot: maestro/out/d3-settled
