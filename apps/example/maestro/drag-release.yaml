# Reproduces a drag-and-release race without a real drag: no test tool can
# drive the native tab bar scrub, so demo-finger.ts feeds the perch a
# scripted finger instead - began at Explore's center, stepped to the last
# tab's center, ended there. A host app's own navigation then lands `lag` ms
# after the scripted release, not the script's first event, standing in for
# a slow host app; the default lag is 250ms. Pair with a screen recording
# and `tools/frame-stack.sh` for frames.
#
# What a reviewer should see in those frames: with the fix and the default
# lag, he heads to the release slot, seats there, and stays put once the
# navigation lands. Without the fix, he runs back toward the old slot first,
# then turns round once the new selection arrives. A lag above 800ms (the
# library's grace window) shows the fallback either way: he waits at the
# release slot, gives up, runs home, then turns round when the navigation
# lands. Maestro cannot measure x - the frames are the evidence, not this
# flow's exit status.
appId: dev.example.companion
---
- launchApp
- waitForAnimationToEnd
- tapOn: 'Home'
- waitForAnimationToEnd
- openLink: companion://explore?demo=drag-release
# iOS confirms a custom-scheme link opened from outside the app
- tapOn:
    text: 'Open'
    optional: true
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: maestro/out/dr1-drag-release-settled
